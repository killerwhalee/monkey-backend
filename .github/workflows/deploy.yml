# Deploy backend to production server on push to main.
#
# Runs on the self-hosted runner registered directly on the deploy server
# (killerwhalee-serv-o), so no SSH hop is needed — the runner IS the deploy
# target.
#
# Server prerequisites:
#   - uv installed at ~/.local/bin
#   - backend repo cloned at /home/killerwhalee/monkey/backend
#   - services grouped under monkey.target (see deploy/systemd/)
#   - deploy user has passwordless sudo for systemctl restart monkey.target
#     (/etc/sudoers.d/monkey: killerwhalee ALL=(root) NOPASSWD: /usr/bin/systemctl restart monkey.target)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: monkey-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: [self-hosted, serv-o]

    steps:
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy
        working-directory: /home/killerwhalee/monkey/backend
        run: |
          set -e
          git fetch origin
          git reset --hard origin/main
          uv sync --frozen
          # No pre-deploy DB dump: the DB is backed up daily by serv-o's ops-backup.timer (restic).
          uv run python manage.py migrate --noinput
          uv run python manage.py collectstatic --noinput
          sudo systemctl restart monkey.target
